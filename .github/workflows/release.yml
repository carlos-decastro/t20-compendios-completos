name: Release Foundry Module

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest and build release archive
        run: python3 .github/scripts/build_release.py

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/t20-compendios-completos.zip dist/module.json --clobber
          else
            gh release create "$TAG" \
              dist/t20-compendios-completos.zip \
              dist/module.json \
              --title "Tormenta20 — Compêndios Completos ${TAG}" \
              --notes-file dist/release-notes.md
          fi
